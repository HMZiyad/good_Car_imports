services:
  web:
    image: php:8.2-apache
    container_name: good_car_web
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_NAME=good_car_imports
      - DB_USER=root
      - DB_PASS=secret
    depends_on:
      - db
    command: >
      bash -c "
      docker-php-ext-install pdo pdo_mysql &&
      a2enmod rewrite &&
      apache2-foreground"

  db:
    image: mysql:8.0
    container_name: good_car_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: good_car_imports
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
